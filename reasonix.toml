allow = ["Bash(git commit:*)", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe -c @'\nimport os, tempfile, uuid, sys\nsys.path.insert(0, os.getcwd())\nfrom services.library_service import LibraryService\nfrom utils.thumbnail import generate_thumbnail\n\ntmp = tempfile.mkdtemp(prefix=\"dbg_\")\nroot = os.path.join(tmp, \"storage\"); os.makedirs(root)\nsrc = os.path.join(tmp, \"src\"); os.makedirs(src)\nfrom PIL import Image\nfor i in range(2):\n    Image.new(\"RGB\", (100, 150)).save(os.path.join(src, f\"img{i}.png\"))\nsvc = LibraryService(os.path.join(tmp, \"lib.db\"))\noid = str(uuid.uuid4())\nsvc.import_directory(oid, \"Alpha\", {}, src, root, is_new=True)\nobj = svc.get_object(oid)\ncache = os.path.join(root, \".thumbcache\"); os.makedirs(cache)\nthumb = generate_thumbnail(obj[\"cover_image\"], cache)\nprint(\"thumb:\", thumb)\nprint(\"before:\", sorted(os.listdir(cache)))\nsvc.delete_object(oid, delete_files=True, storage_root=root)\nprint(\"after:\", sorted(os.listdir(cache)) if os.path.isdir(cache) else \"no cache dir\")\nprint(\"obj cover:\", obj[\"cover_image\"])\nprint(\"img paths:\", [i[\"filepath\"] for i in svc.db.get_images(oid)])\n'@", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe .debug_thumbs.py", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe tests/smoke_library_service.py", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe .debug_smoke.py 2>&1 | Select-String -Pattern \"DBG|FAIL|PASS\"", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe tests/smoke_library_service.py; Remove-Item .debug_smoke.py, .debug_thumbs.py -ErrorAction SilentlyContinue", "Bash=$env:PYTHONIOENCODING=\"utf-8\"; .venv\\Scripts\\python.exe .debug_launch.py"]
